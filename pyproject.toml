[project]
name = "constraintos"
version = "1.0.0-alpha.29"
description = "ConstraintOS CLI and local product for specification-first AI workflow tooling"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "fastapi>=0.115",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30",
  "pymupdf>=1.24,<2"
]

[project.scripts]
constraintos = "constraintos.cli:main"
cos = "constraintos.cli:main"
cos-runtime = "constraintos.runtime_cli:main"
cos-runtime-evidence = "runtime.cli:main"
cos-runtime-approval = "runtime.approval_cli:main"
cos-validate = "constraintos.validation_cli:main"
cos-apply-constraints = "constraintos.constraint_pack_cli:main"
cos-graphics-validate = "constraintos.graphics_validation_cli:main"
cos-graphics-contracts = "constraintos.graphics_contracts_cli:main"
cos-graphics-candidates = "constraintos.candidate_manifests_cli:main"
cos-graphics-byte-loader = "constraintos.candidate_image_byte_loader_cli:main"
cos-research-render = "runtime.research_to_render.cli:main"
cos-extract-source-plate = "runtime.research_to_render.source_plate:main"
cos-generate-candidates = "runtime.research_to_render.candidate_generation:main"
cos-validate-generated-candidates = "runtime.research_to_render.candidate_validation:main"
cos-repair-generated-candidates = "runtime.research_to_render.candidate_repair:main"
cos-image-job = "runtime.product.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["constraintos*", "runtime*"]
exclude = ["tests*", "runtime.tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

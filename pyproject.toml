[project]
name = "constraintos"
version = "0.5.0"
description = "ConstraintOS CLI for specification-first AI workflow tooling"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22"
]

[project.scripts]
constraintos = "constraintos.cli:main"
cos = "constraintos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

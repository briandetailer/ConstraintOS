[project]
name = "constraintos"
version = "1.0.0-alpha.27"
description = "ConstraintOS CLI for specification-first AI workflow tooling"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "fastapi>=0.115"
]

[project.scripts]
constraintos = "constraintos.cli:main"
cos = "constraintos.cli:main"
cos-runtime = "constraintos.runtime_cli:main"
cos-runtime-evidence = "runtime.cli:main"
cos-runtime-approval = "runtime.approval_cli:main"
cos-validate = "constraintos.validation_cli:main"
cos-apply-constraints = "constraintos.constraint_pack_cli:main"
cos-graphics-validate = "constraintos.graphics_validation_cli:main"
cos-graphics-contracts = "constraintos.graphics_contracts_cli:main"
cos-graphics-candidates = "constraintos.candidate_manifests_cli:main"
cos-graphics-byte-loader = "constraintos.candidate_image_byte_loader_cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["constraintos*", "runtime*"]
exclude = ["tests*", "runtime.tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

name: Runtime package install validation

on:
  push:
    branches:
      - phase-1-cli-tooling
  pull_request:
    branches:
      - phase-1-cli-tooling
  workflow_dispatch:

jobs:
  runtime-package-install:
    name: Runtime package install / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          rm -rf dist
          python -m build

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      - name: Validate installed Runtime commands
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"

          cos-runtime --help
          cos-runtime-evidence --help
          cos-runtime-approval --help

      - name: Validate installed Runtime evidence and approval workflows
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"

          cat > spec.json <<'JSON'
          {
            "artifact": {"id": "SPEC-0001"},
            "execution_steps": [
              {"id": "NODE-0001", "plugin": "generic", "action": "prepare"}
            ]
          }
          JSON

          cat > workers.json <<'JSON'
          {
            "workers": [
              {"worker_id": "WORKER-0001", "plugins": ["generic"]}
            ]
          }
          JSON

          cat > policy.json <<'JSON'
          {
            "runtime_approval_policy": {
              "name": "default-runtime-approval/v1",
              "version": "v1",
              "contract_registry_version": "runtime-contracts/v1"
            },
            "required_evidence_artifacts": [
              "runtime_report",
              "runtime_trace_report",
              "runtime_contract_registry",
              "runtime_evidence_manifest"
            ],
            "required_checks": ["verify_runtime_evidence_manifest"],
            "allowed_decisions": ["approved", "rejected", "needs_review", "waived"],
            "allowed_check_statuses": ["passed", "failed", "waived", "needs_review"],
            "approvers": ["policy-owner"],
            "waiver_rules": {"requires_note_or_waived_check": true},
            "rejection_rules": {"requires_note_or_failed_check": true}
          }
          JSON

          cos-runtime-evidence --spec spec.json --workers workers.json --output-dir runtime-evidence --format json
          test -f runtime-evidence/reports/RUNTIME-0001.json
          test -f runtime-evidence/traces/RUNTIME-0001.json
          test -f runtime-evidence/contracts/runtime-contract-registry.json
          test -f runtime-evidence/evidence/RUNTIME-0001.json

          cos-runtime-approval \
            --evidence-manifest runtime-evidence/evidence/RUNTIME-0001.json \
            --evidence-artifact-id ARTIFACT-0004 \
            --policy policy.json \
            --decided-by policy-owner \
            --decided-at 2026-07-06T00:00:00Z \
            --output-dir runtime-approval \
            --format json
          test -f runtime-approval/approvals/RUNTIME-0001.json

      - name: Upload Runtime package artifact
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v7
        with:
          name: constraintos-runtime-package-1.0.0-alpha.27
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

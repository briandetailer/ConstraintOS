name: Validate ConstraintOS

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - phase-1-cli-tooling

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e . pytest
      - name: Run tests
        run: pytest
      - name: Validate repository metadata and schemas
        run: constraintos validate docs examples
      - name: Generate traceability report
        run: constraintos trace docs examples > traceability-report.json
      - name: Generate ID registry
        run: constraintos registry docs examples --output id-registry.yaml
